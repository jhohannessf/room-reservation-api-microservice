# src/test/resources/application.properties  (booking-ms)
# Este arquivo SOMBREIA o application.properties de src/main durante os testes,
# por isso o spring.application.name precisa ser repetido e NÃO há spring.config.import
# (ou seja, o Config Server não é consultado).
spring.application.name=booking-ms

# Datasource, RabbitMQ e Kafka (host/porta) vêm do @DynamicPropertySource.
# O schema vem do Flyway (db/migration), validado pelo Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

docker.host=tcp://localhost:2375

# Sem Config Server e sem Eureka
spring.cloud.config.enabled=false
eureka.client.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.key=${JWT_KEY}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username= ${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password= ${RABBITMQ_DEFAULT_PASS}

# Tratando falhas no RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=2
spring.rabbitmq.listener.simple.retry.initial-interval=200
spring.rabbitmq.listener.simple.retry.multiplier=1
spring.rabbitmq.listener.simple.retry.max-interval=300000

# Kafka (Serializar -> objeto para json)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# OpenFeign / Resilience4j (mesmos valores do config-repo)
spring.cloud.openfeign.circuitbreaker.enabled=false
resilience4j.circuitbreaker.instances.atualizaSala.slidingWindowSize=3
resilience4j.circuitbreaker.instances.atualizaSala.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.atualizaSala.waitDurationInOpenState=50s


