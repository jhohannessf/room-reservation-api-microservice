spring.application.name=gateway-ms
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- USER-MS ---
spring.cloud.gateway.mvc.routes[0].id=user-ms
spring.cloud.gateway.mvc.routes[0].uri=lb://user-ms
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/user-ms/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=1

# --- ROOM-MS ---
spring.cloud.gateway.mvc.routes[1].id=room-ms
spring.cloud.gateway.mvc.routes[1].uri=lb://room-ms
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/room-ms/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1

# --- BOOKING-MS ---
spring.cloud.gateway.mvc.routes[2].id=booking-ms
spring.cloud.gateway.mvc.routes[2].uri=lb://booking-ms
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/booking-ms/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=1

