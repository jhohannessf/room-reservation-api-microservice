spring.application.name=gateway-ms
server.port=8080

# Eureka (o gateway também é cliente)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=user-ms
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-ms
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/user-ms/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[1].id=room-ms
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://room-ms
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/room-ms/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[2].id=booking-ms
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://booking-ms
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/booking-ms/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

#url do server = http://localhost:8761/