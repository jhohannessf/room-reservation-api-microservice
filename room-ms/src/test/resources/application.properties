# src/test/resources/application.properties  (room-ms)
# Este arquivo SOMBREIA o application.properties de src/main durante os testes,
# por isso o spring.application.name precisa ser repetido e NÃO há spring.config.import
# (ou seja, o Config Server não é consultado).
spring.application.name=room-ms

# Datasource, RabbitMQ e Kafka (host/porta) vêm do @DynamicPropertySource.
# O schema vem do Flyway (db/migration), validado pelo Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

docker.host=tcp://localhost:2375

# Sem Config Server e sem Eureka
spring.cloud.config.enabled=false
eureka.client.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.key=${JWT_KEY}

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username= ${RABBITMQ_DEFAULT_USER}
spring.rabbitmq.password= ${RABBITMQ_DEFAULT_PASS}

# Tratando falhas no RabbitMQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=2
spring.rabbitmq.listener.simple.retry.initial-interval=200
spring.rabbitmq.listener.simple.retry.multiplier=1
spring.rabbitmq.listener.simple.retry.max-interval=300000

# Kafka (consumidor): sem isso o padrão seria StringDeserializer e o listener não converte para ReservaRequest - Desserializar -> json para objeto
spring.kafka.consumer.group-id=room-ms-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=br.com.jhohannesfreitas.room_ms.dto.ReservaRequest
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.jhohannesfreitas.room_ms.dto




