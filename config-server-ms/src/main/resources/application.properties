spring.application.name=config-server
server.port=8888

# Ativar o modo de leitura de arquivos locais (em vez de github)
spring.profiles.active=native

#Caminho da pasta onde você vai colocar os arquivos .properties - Só funciona no seu computador
#spring.cloud.config.server.native.search-locations=file:///D:/CURSO%20TI%20-%202026/Portif%C3%B3lio/Desafio%20-%20N%C3%ADvel%202/room-reservation-api-microservice/config-server-ms/config-repo

# Caminho portável: os arquivos .properties ficam empacotados dentro do próprio jar, em src/main/resources/config-repo/.
# Funciona igual em qualquer máquina e dentro de containers Docker, sem depender de um caminho absoluto do disco.
spring.cloud.config.server.native.search-locations=classpath:/config-repo/

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
