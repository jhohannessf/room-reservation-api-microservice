spring.application.name=user-ms

spring.datasource.url=jdbc:mysql://localhost:3306/user_ms?createDatabaseIfNotExist=true
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true

spring.jpa.hibernate.ddl-auto=validate

jwt.expiration=${JWT_EXPIRATION:900000}
jwt.key=${JWT_KEY}

#Configuração de envio E-mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Login com o Google (URL: http://localhost:8080/oauth2/authorization/google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

#Login com o Github (URL: http://localhost:8080/oauth2/authorization/github)
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user:email

server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/